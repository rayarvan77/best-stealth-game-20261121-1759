<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum of Shadows — a stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07070f;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace, ui-monospace, monospace;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    display: block;
    width: min(96vw, 960px);
    height: auto;
    image-rendering: pixelated;
    border: 2px solid #2b3352;
    background: #0b0b16;
    cursor: crosshair;
  }
  #hint {
    color: #b8ac93;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="hint">WASD / arrows move &middot; Shift sneak &middot; click to walk &middot; R restart &middot; P pause &middot; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
